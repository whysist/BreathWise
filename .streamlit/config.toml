[browser]
gatherUsageStats = false

# Calm, "clean air" palette: cool neutrals plus one sky-teal accent.
# Strong colour is reserved for the AQI category so it always carries meaning.
[theme]
base = "light"
primaryColor = "#1F7A8C"
backgroundColor = "#F6F9FA"
secondaryBackgroundColor = "#E8F0F3"
textColor = "#1E2A33"
linkColor = "#1F7A8C"
borderColor = "#D3DFE4"
blueColor = "#1F7A8C"
